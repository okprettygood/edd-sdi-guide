<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>How to Get EDD Disability (SDI) — Full Guide</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue: #1a56db;
    --blue-light: #ebf2ff;
    --blue-mid: #3b82f6;
    --green: #057a55;
    --green-light: #e3faee;
    --amber: #b45309;
    --amber-light: #fffbeb;
    --red: #c81e1e;
    --red-light: #fdf2f2;
    --gray-50: #f9fafb;
    --gray-100: #f3f4f6;
    --gray-200: #e5e7eb;
    --gray-400: #9ca3af;
    --gray-600: #4b5563;
    --gray-800: #1f2937;
    --gray-900: #111827;
    --radius: 10px;
    --radius-sm: 6px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #f8f9fc;
    color: var(--gray-900);
    min-height: 100vh;
    font-size: 16px;
    line-height: 1.6;
  }

  /* Header */
  .site-header {
    background: var(--blue);
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .site-header .logo {
    font-size: 13px;
    font-weight: 600;
    color: rgba(255,255,255,0.9);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .site-header .divider { width: 1px; height: 18px; background: rgba(255,255,255,0.3); }
  .site-header .title { font-size: 14px; color: rgba(255,255,255,0.8); font-weight: 400; }

  /* Layout */
  .container { max-width: 680px; margin: 0 auto; padding: 0 20px; }

  /* Hero */
  .hero {
    background: var(--blue);
    padding: 40px 24px 52px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 0; right: 0;
    height: 32px;
    background: #f8f9fc;
    clip-path: ellipse(55% 100% at 50% 100%);
  }
  .hero h1 {
    font-size: clamp(22px, 5vw, 30px);
    font-weight: 600;
    color: #fff;
    line-height: 1.2;
    margin-bottom: 10px;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
  }
  .hero p {
    font-size: 15px;
    color: rgba(255,255,255,0.75);
    max-width: 420px;
    margin: 0 auto;
  }
  .hero-badges {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .hero-badge {
    font-size: 12px;
    font-weight: 500;
    background: rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.9);
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.2);
  }

  /* Progress nav */
  .progress-nav {
    background: #fff;
    border-bottom: 1px solid var(--gray-200);
    padding: 16px 20px;
    position: sticky;
    top: 57px;
    z-index: 90;
  }
  .progress-track {
    display: flex;
    gap: 3px;
    margin-bottom: 10px;
  }
  .progress-seg {
    flex: 1;
    height: 3px;
    border-radius: 2px;
    background: var(--gray-200);
    transition: background 0.3s;
    cursor: pointer;
  }
  .progress-seg.done { background: var(--green); }
  .progress-seg.active { background: var(--blue); }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .phase-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .step-count { font-size: 12px; color: var(--gray-400); }

  /* Main content */
  .main { padding: 28px 20px 100px; max-width: 680px; margin: 0 auto; }

  .step-panel { display: none; animation: fadeUp 0.2s ease; }
  .step-panel.active { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .step-title {
    font-size: clamp(20px, 4vw, 26px);
    font-weight: 600;
    color: var(--gray-900);
    line-height: 1.2;
    margin-bottom: 8px;
  }
  .step-subtitle {
    font-size: 15px;
    color: var(--gray-600);
    margin-bottom: 24px;
    line-height: 1.55;
  }

  /* Cards */
  .card {
    background: #fff;
    border: 1px solid var(--gray-200);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 10px;
  }
  .card-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--gray-900);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .card-body {
    font-size: 14px;
    color: var(--gray-600);
    line-height: 1.65;
  }
  .card-body br { display: block; margin-bottom: 2px; content: ''; }

  /* Alert boxes */
  .alert {
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 10px;
    border-left: 3px solid;
  }
  .alert strong { font-weight: 600; display: block; margin-bottom: 2px; }
  .alert-blue { background: var(--blue-light); border-color: var(--blue-mid); color: #1e40af; }
  .alert-green { background: var(--green-light); border-color: var(--green); color: #065f46; }
  .alert-amber { background: var(--amber-light); border-color: #f59e0b; color: var(--amber); }
  .alert-red { background: var(--red-light); border-color: #f87171; color: var(--red); }

  /* Example blocks */
  .ex {
    background: var(--gray-50);
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    margin-top: 10px;
    font-size: 13px;
    color: var(--gray-600);
    line-height: 1.65;
  }
  .ex-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 3px;
    display: block;
  }
  .ex-label.bad { color: var(--red); }
  .ex-label.good { color: var(--green); }

  /* Tags */
  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
    vertical-align: middle;
  }
  .tag-red { background: var(--red-light); color: var(--red); }
  .tag-blue { background: var(--blue-light); color: var(--blue); }
  .tag-green { background: var(--green-light); color: var(--green); }
  .tag-amber { background: var(--amber-light); color: var(--amber); }

  /* Field table */
  .field-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .field-table tr { border-bottom: 1px solid var(--gray-100); }
  .field-table tr:last-child { border-bottom: none; }
  .field-table td { padding: 9px 0; vertical-align: top; line-height: 1.5; }
  .field-table td:first-child { color: var(--gray-600); padding-right: 12px; width: 60%; }
  .field-table td:last-child { font-weight: 500; }
  .ans-no { color: var(--green); }
  .ans-date { color: var(--blue); font-weight: 400; font-size: 12px; }
  .ans-warn { color: var(--red); }

  /* Denial rows */
  .denial-row {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 12px 0;
    border-bottom: 1px solid var(--gray-100);
  }
  .denial-row:last-child { border-bottom: none; padding-bottom: 0; }
  .denial-dot {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--red-light);
    border: 1.5px solid #fca5a5;
    flex-shrink: 0;
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--red);
  }
  .denial-label { font-size: 14px; font-weight: 600; color: var(--gray-900); margin-bottom: 3px; }
  .denial-detail { font-size: 13px; color: var(--gray-600); line-height: 1.55; }

  /* Summary overview */
  .phase-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--gray-400);
    margin: 20px 0 8px;
  }
  .ov-row {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 11px 0;
    border-bottom: 1px solid var(--gray-100);
    cursor: pointer;
    text-decoration: none;
  }
  .ov-row:last-child { border-bottom: none; }
  .ov-row:hover .ov-title { color: var(--blue); }
  .ov-num {
    width: 28px; height: 28px;
    border-radius: 50%;
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .ov-title { font-size: 14px; font-weight: 500; color: var(--gray-900); margin-bottom: 1px; }
  .ov-sub { font-size: 12px; color: var(--gray-400); }
  .footer-info {
    background: var(--gray-100);
    border-radius: var(--radius);
    padding: 14px 16px;
    font-size: 13px;
    color: var(--gray-600);
    line-height: 1.8;
    margin-top: 16px;
  }
  .footer-info strong { color: var(--gray-900); font-weight: 600; display: block; margin-bottom: 4px; }

  /* Bottom nav */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #fff;
    border-top: 1px solid var(--gray-200);
    padding: 12px 20px;
    display: flex;
    gap: 10px;
    max-width: 680px;
    margin: 0 auto;
  }
  /* center fixed nav */
  .bottom-nav-outer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #fff;
    border-top: 1px solid var(--gray-200);
    padding: 12px 20px;
    z-index: 200;
  }
  .bottom-nav-inner {
    max-width: 680px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
  }
  .btn {
    flex: 1;
    padding: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    border-radius: var(--radius);
    cursor: pointer;
    border: 1.5px solid var(--gray-200);
    background: #fff;
    color: var(--gray-800);
    transition: background 0.15s, border-color 0.15s;
  }
  .btn:hover:not(:disabled) { background: var(--gray-100); }
  .btn:disabled { opacity: 0.3; cursor: default; }
  .btn-primary {
    background: var(--blue);
    color: #fff;
    border-color: var(--blue);
  }
  .btn-primary:hover:not(:disabled) { background: #1648c7; border-color: #1648c7; }

  /* Timeline */
  .timeline { display: flex; flex-direction: column; }
  .tl-item { display: flex; gap: 12px; }
  .tl-left { display: flex; flex-direction: column; align-items: center; width: 28px; flex-shrink: 0; }
  .tl-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
  .tl-line { flex: 1; width: 1.5px; background: var(--gray-200); margin: 4px 0; min-height: 16px; }
  .tl-content { flex: 1; padding-bottom: 16px; }
  .tl-date { font-size: 11px; font-weight: 600; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 2px; }
  .tl-label { font-size: 14px; font-weight: 500; color: var(--gray-900); }
  .tl-note { font-size: 12px; color: var(--gray-400); line-height: 1.5; margin-top: 2px; }

  a { color: var(--blue); }

  @media (max-width: 400px) {
    .hero h1 { font-size: 20px; }
    .step-title { font-size: 18px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <span class="logo">California EDD</span>
  <div class="divider"></div>
  <span class="title">SDI Disability Guide</span>
</header>

<div class="hero">
  <div class="container">
    <h1>How to get EDD disability benefits (SDI)</h1>
    <p>A plain-language step-by-step guide. For anyone in California who needs help filing.</p>
    <div class="hero-badges">
      <span class="hero-badge">13 steps</span>
      <span class="hero-badge">Mental health included</span>
      <span class="hero-badge">What gets you denied</span>
      <span class="hero-badge">Free</span>
    </div>
  </div>
</div>

<div class="progress-nav">
  <div class="container">
    <div class="progress-track" id="prog"></div>
    <div class="progress-meta">
      <span class="phase-badge" id="phase-pill"></span>
      <span class="step-count" id="step-count"></span>
    </div>
  </div>
</div>

<div class="main" id="main-content">
  <div id="steps-container"></div>
</div>

<div class="bottom-nav-outer">
  <div class="bottom-nav-inner">
    <button class="btn" id="btn-back" onclick="move(-1)">Back</button>
    <button class="btn btn-primary" id="btn-next" onclick="move(1)">Next</button>
  </div>
</div>

<script>
const PHASES = [
  { label: "Overview", bg: "#ebf2ff", color: "#1a56db" },
  { label: "Before you file", bg: "#ebf2ff", color: "#1a56db" },
  { label: "Before you file", bg: "#ebf2ff", color: "#1a56db" },
  { label: "Before you file", bg: "#ebf2ff", color: "#1a56db" },
  { label: "Filing", bg: "#e3faee", color: "#057a55" },
  { label: "Filing", bg: "#e3faee", color: "#057a55" },
  { label: "Filing", bg: "#e3faee", color: "#057a55" },
  { label: "Special case", bg: "#fffbeb", color: "#b45309" },
  { label: "The form answers", bg: "#fffbeb", color: "#b45309" },
  { label: "After filing", bg: "#fffbeb", color: "#b45309" },
  { label: "After filing", bg: "#fffbeb", color: "#b45309" },
  { label: "After filing", bg: "#fffbeb", color: "#b45309" },
  { label: "What gets you denied", bg: "#fdf2f2", color: "#c81e1e" },
  { label: "Summary", bg: "#e3faee", color: "#057a55" },
];

const STEPS = [
  {
    title: "What is EDD disability (SDI)?",
    subtitle: "Before we start — let's understand what this is.",
    content: `
      <div class="card"><div class="card-title">SDI = State Disability Insurance</div><div class="card-body">It is money the California government pays you when you are too sick or injured to work.<br><br>You already paid into it — it was taken from your paycheck automatically. Look for <strong>"CASDI"</strong> on an old pay stub.</div></div>
      <div class="card"><div class="card-title">How much do you get?</div><div class="card-body">About <strong>70–90% of what you used to earn</strong>, up to $1,765 per week. You can receive it for up to 52 weeks.</div></div>
      <div class="card"><div class="card-title">Who is this for?</div><div class="card-body">Anyone who:<br><br>— Cannot work because of illness, injury, or mental health<br>— Paid into CASDI through a California job<br>— Was working, or actively looking for work, when they got sick</div></div>
      <div class="alert alert-blue"><strong>Not currently working?</strong> That is okay. As long as you had a California job in the last 18 months that took CASDI from your paycheck, you may still qualify.</div>`
  },
  {
    title: "Step 1 — Check if you qualify",
    subtitle: "You need 3 things to qualify. Read each one carefully.",
    content: `
      <div class="card"><div class="card-title">1. You paid into CASDI</div><div class="card-body">Look at an old California pay stub. Find <strong>"CASDI"</strong> or <strong>"SDI"</strong> in the deductions. If you see it, you paid in.<br><br>You need at least <strong>$300</strong> in CASDI wages in the last 18 months.</div></div>
      <div class="card"><div class="card-title">2. You cannot do your normal work</div><div class="card-body">Your disability must stop you from doing your regular job duties for <strong>at least 8 days in a row</strong>. A doctor must confirm this.</div></div>
      <div class="card"><div class="card-title">3. You were working or looking for work</div><div class="card-body">When your disability started, you were either:<br><br>— Currently employed, OR<br>— Actively applying for jobs<br><br>If you had not been looking for work at all, it is harder to qualify.</div></div>
      <div class="alert alert-amber"><strong>Self-employed or 1099?</strong> You are probably not covered unless you opted into SDI separately. BUT — if you had any W-2 job in the last 18 months, those wages may still count.</div>
      <div class="alert alert-green"><strong>If you are unsure — file anyway.</strong> EDD will tell you if you don't qualify. The worst they can say is no.</div>`
  },
  {
    title: "Step 2 — Know your disability start date",
    subtitle: "This date is very important. Once you file, you cannot change it.",
    content: `
      <div class="card"><div class="card-title">What is the disability start date?</div><div class="card-body">The first day your condition stopped you from doing your normal job.<br><br>Not the day you went to the doctor. Not the day you decided to file. <strong>The first day you could not work.</strong></div></div>
      <div class="ex"><span class="ex-label good">Example</span>You started feeling too depressed to work on October 3rd. You saw your doctor on October 15th.<br><br>Your disability start date is <strong>October 3rd</strong> — not October 15th.</div>
      <div class="alert alert-amber" style="margin-top:10px"><strong>Why it matters:</strong> You only get paid starting from this date (after the 7-day waiting period). You also have 49 days from this date to file. After 49 days, you lose benefits for missed days.</div>
      <div class="alert alert-blue"><strong>Your doctor does not need to have seen you on that exact day.</strong> They can confirm your disability started earlier based on your symptoms. This is common and accepted by EDD.</div>`
  },
  {
    title: "Step 3 — Talk to your doctor first",
    subtitle: "Your doctor has to sign off on your claim. Prepare them before you file.",
    content: `
      <div class="card"><div class="card-title">Who can certify your disability?</div><div class="card-body">— Medical doctor (MD or DO)<br>— Psychiatrist<br>— Psychologist<br>— Nurse practitioner (NP)<br>— Licensed therapist (LCSW or MFT)<br><br>If you see both a therapist and a psychiatrist, ask <strong>both</strong> to certify. It makes your claim stronger.</div></div>
      <div class="card"><div class="card-title">What to tell your doctor</div><div class="card-body">Tell them specifically:<br><br>1. What your job requires you to do<br>2. Which tasks you cannot do because of your condition<br>3. Your disability start date — so their dates match yours</div></div>
      <div class="alert alert-green"><strong>For mental health claims:</strong> Ask your doctor to describe your <em>functional limitations</em> — exactly how your condition stops you from working. Vague notes get denied.
        <div class="ex" style="margin-top:8px"><span class="ex-label bad">Too vague — often denied:</span>"Patient has depression and anxiety."<br><br><span class="ex-label good">Specific — better chance of approval:</span>"Patient has severe depressive episodes — unable to concentrate, maintain a schedule, or interact with others for 8+ consecutive days."</div>
      </div>
      <div class="alert alert-amber"><strong>Ask if your doctor submits electronically.</strong> If they only do paper, bring them a printed DE 2501 form. Paper takes 1–2 extra weeks to process.</div>`
  },
  {
    title: "Step 4 — Create your EDD account",
    subtitle: "Filing online is faster and easier to track.",
    content: `
      <div class="card"><div class="card-title">Go to edd.ca.gov</div><div class="card-body">Click "SDI Online" → Create a myEDD account → Start a new Disability Insurance claim.<br><br><a href="https://edd.ca.gov/en/disability/SDI_Online/" target="_blank">edd.ca.gov — SDI Online portal →</a></div></div>
      <div class="card"><div class="card-title">What to have ready before you start</div><div class="card-body">— Your Social Security Number (SSN)<br>— California driver's license or ID number<br>— Employer's name and address (last job)<br>— Your last day of work<br>— Doctor's name, phone, and license number<br>— Bank account info (for direct deposit)</div></div>
      <div class="alert alert-blue"><strong>Don't have everything?</strong> Start anyway. The most important thing is filing before the <strong>49-day deadline</strong> from your disability start date.</div>`
  },
  {
    title: "Step 5 — Fill out YOUR part (Part A)",
    subtitle: "Go slowly. Every blank field can cause a delay or denial.",
    content: `
      <div class="card"><div class="card-title">Disability start date</div><div class="card-body">The first day you could not do your job. Must match what your doctor will write. Confirm with your doctor before filing.</div></div>
      <div class="card"><div class="card-title">Describe your condition <span class="tag tag-red">Very important</span></div><div class="card-body">Don't just write the diagnosis name. Explain how it stops you from working.</div>
        <div class="ex"><span class="ex-label bad">Too vague:</span>"Anxiety and depression"<br><br><span class="ex-label good">Better:</span>"Severe anxiety and depression. Cannot concentrate, leave home, or interact with coworkers. Unable to perform normal job duties."</div>
      </div>
      <div class="card"><div class="card-title">List ALL employers from the last 18 months</div><div class="card-body">Not just your most recent job. Every job that took CASDI from your check counts toward your benefit amount. Missing one means missing wages.</div></div>
      <div class="card"><div class="card-title">Other income or pay received</div><div class="card-body">Report everything — sick pay, PTO, vacation pay. If your employer is still paying your full salary, you may not qualify yet. Report it and let EDD decide.</div></div>
      <div class="card"><div class="card-title">Your doctor's license number</div><div class="card-body">California format: letter + numbers (example: A12345). Do <strong>NOT</strong> use their DEA number or NPI. Ask the doctor's office for the exact number.</div></div>
      <div class="alert alert-amber"><strong>Don't leave anything blank.</strong> If it doesn't apply, write "N/A." A blank field can trigger an automatic denial.</div>`
  },
  {
    title: "Step 6 — Your doctor fills out their part (Part B)",
    subtitle: "This is where most claims get denied. Coach your doctor beforehand.",
    content: `
      <div class="alert alert-blue">After you submit Part A, EDD notifies your doctor to complete their section. They have 49 days from your disability start date. <strong>Follow up — don't assume they did it.</strong></div>
      <div class="card"><div class="card-title">What your doctor must include</div><div class="card-body">— Your diagnosis and ICD-10 code (example: F32.1 for major depression)<br>— The date your disability started<br>— An estimated return-to-work date<br>— How your condition limits your ability to work<br>— Their California license number — typed clearly<br>— Their signature</div></div>
      <div class="alert alert-green"><strong>Most important field — functional limitations:</strong> Your doctor must explain HOW your condition stops you from working.
        <div class="ex" style="margin-top:8px"><span class="ex-label bad">Gets denied:</span>"Patient has generalized anxiety disorder."<br><br><span class="ex-label good">Gets approved:</span>"Patient has GAD causing panic attacks 3–4x per week. Unable to concentrate for sustained periods, maintain a schedule, or interact with others. Cannot perform job duties."</div>
      </div>
      <div class="alert alert-amber"><strong>Dates must match.</strong> Your disability start date in Part A must be the same date your doctor writes in Part B. Even one day difference can flag your claim.</div>

let current = 0;

function render() {
  const container = document.getElementById('steps-container');
  container.innerHTML = '';
  STEPS.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'step-panel' + (i === current ? ' active' : '');
    div.innerHTML = `<h1 class="step-title">${s.title}</h1><p class="step-subtitle">${s.subtitle}</p>${s.content}`;
    container.appendChild(div);
  });

  const prog = document.getElementById('prog');
  prog.innerHTML = '';
  STEPS.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'progress-seg' + (i < current ? ' done' : i === current ? ' active' : '');
    seg.onclick = () => goTo(i);
    prog.appendChild(seg);
  });

  const ph = PHASES[current];
  const pill = document.getElementById('phase-pill');
  pill.textContent = ph.label;
  pill.style.background = ph.bg;
  pill.style.color = ph.color;

  const isFirst = current === 0;
  const isLast = current === STEPS.length - 1;
  document.getElementById('step-count').textContent = (isFirst || isLast) ? '' : `Step ${current} of ${STEPS.length - 2}`;
  document.getElementById('btn-back').disabled = isFirst;
  document.getElementById('btn-next').textContent = isLast ? 'Start over' : current === STEPS.length - 2 ? 'See summary →' : 'Next →';
}

function move(dir) {
  if (dir === 1 && current === STEPS.length - 1) current = 0;
  else current = Math.max(0, Math.min(STEPS.length - 1, current + dir));
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goTo(n) {
  current = n;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

render();
</script>
